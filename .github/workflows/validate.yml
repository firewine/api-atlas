name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build-and-verify:
    name: Validate (${{ matrix.deployment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment: root
            site: https://api-atlas.pages.dev
            base: /
          - deployment: subpath
            site: https://getbeta.app
            base: /api-atlas/
    env:
      SITE_URL: ${{ matrix.site }}
      BASE_PATH: ${{ matrix.base }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test contracts, check source and verify static output
        run: npm run validate
      - name: Install Chromium for production browser tests
        run: npx playwright install --with-deps chromium
      - name: Verify Compare, Search and static Guides in the production build
        run: npm run test:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.deployment }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
